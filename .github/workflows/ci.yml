name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Check Lua syntax
        run: |
          for file in AuctionatorTools/*.lua tests/*.lua; do
            luac5.1 -p "$file"
          done
      - name: Run tests
        run: |
          for file in tests/*.lua; do
            lua5.1 "$file"
          done
